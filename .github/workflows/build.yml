name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and package
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: FPSOverlay
          path: dist/FPSOverlay
